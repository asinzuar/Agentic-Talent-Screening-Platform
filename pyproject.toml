[project]
name = "agentic-talent-screener"
version = "0.1.0"
description = "Agentic LLM system that ranks job applicants on verifiable resume evidence and resists adversarial resumes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.150.1",
    "numpy>=2.5.5",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
    "fastapi[standard]>=0.164.0",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
agentic-talent-screener = "agentic_talent_screener:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.fastapi]
entrypoint = "agentic_talent_screener.api.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
